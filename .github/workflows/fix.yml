name: Push lint & fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cache-${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bioblend pykwalify PyYAML
      - name: Perform fixing and linting
        run: |
          make INSTANCE=galaxy.ufz.de fix
          make INSTANCE=galaxy.ufz.de lint
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: create-pull-request/fix
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "output of make lint & make fix"
          title: "Linting and Fixing All Tools"
          body: "I ran make lint & make fix"
          labels: automated
